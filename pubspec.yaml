name: solar_engineer_pro
description: "A comprehensive Flutter application for solar energy engineering, PV sizing, and hydraulic pumping calculations."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI Components & Icons
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_staggered_animations: ^1.1.1

  # State Management & Utilities
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  intl: ^0.19.0

  # Charts & Visualizations
  fl_chart: ^0.66.2

  # Export & PDF Support
  pdf: ^3.10.7
  printing: ^5.11.1
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
